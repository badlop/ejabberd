name: Codacy Security Scan

on:
  push:
    branches: [ "dependabot" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "dependabot" ]
  schedule:
    - cron: '45 13 * * 6'


jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Setup Checkov
        run: |
          sed -i '/PASSWORD/i #checkov:skip=CKV_SECRET_6:' .github/workflows/ci.yml
          sed -i '/PASSWORD/i #checkov:skip=CKV_SECRET_6:' test/docker/docker-compose.yml

      - name: Setup CSSlint
        run: |
          echo "{\"exclude-list\": [\"priv/css/\"]}" > .csslintrc

      - name: Setup Markdownlint
        run: |
          sed -i '1i\<!-- markdownlint-disable -->' .github/ISSUE_TEMPLATE/bug_report.md
          sed -i '1i\<!-- markdownlint-disable -->' .github/ISSUE_TEMPLATE/feature_request.md
          sed -i '1i\<!-- markdownlint-disable MD004 MD013 -->' CODE_OF_CONDUCT.md
          sed -i '1i\<!-- markdownlint-disable MD001 MD004 MD013 MD024 MD025 MD032 MD033 MD041 -->' CHANGELOG.md
          sed -i '1i\<!-- markdownlint-disable MD012 MD013 MD033 MD040 MD041 MD045 -->' README.md
          sed -i '1i\<!-- markdownlint-disable MD013 MD022 MD040 MD041 -->' test/docker/README.md
          sed -i '1i\<!-- markdownlint-disable MD003 MD012 MD013 MD029 MD031 MD033 MD041 MD056 MD060 -->' CONTAINER.md
          sed -i '1i\<!-- markdownlint-disable MD012 MD013 MD031 MD040 MD046 -->' COMPILE.md
          sed -i '1i\<!-- markdownlint-disable MD004 MD012 MD013 MD031 MD032 MD033 -->' CONTRIBUTING.md
          sed -i '1i\<!-- markdownlint-disable MD013 -->' CONTRIBUTORS.md
          sed -i '1i\<!-- markdownlint-disable MD013 -->' SECURITY.md
          sed -i '1i\<!-- markdownlint-disable MD013 -->' priv/mod_invites/HOWTO.md

      - name: Setup Shellcheck
        run: |
          sed -i '1a\# shellcheck disable=all' tools/captcha-ng.sh
          sed -i '1a\# shellcheck disable=SC2013,SC3014,SC3060' tools/check_xep_versions.sh

      - name: Setup Stylelint
        run: |
          sed -i '1i\/* stylelint-disable */' priv/css/admin.css
          sed -i '1i\/* stylelint-disable */' priv/css/bosh.css
          sed -i '1i\/* stylelint-disable */' priv/css/muc.css
          sed -i '1i\/* stylelint-disable */' priv/css/oauth.css
          sed -i '1i\/* stylelint-disable */' priv/css/register.css

      - name: Setup TSQLlint
        run: |
          sed -i '1i\-- tsqllint-disable' sql/*.sql
          sed -i '1s\disable\disable data-compression set-transaction-isolation-level\' sql/mssql*.sql

      - name: Remove escript files which are not shell scripts
        run: |
          rm tools/extract-tr.sh
          rm tools/hook_deps.sh
          rm tools/opt_types.sh

      - name: Remove external files
        run: |
          find priv/ -name "*.min.*" -type f -delete

      - name: Remove other files
        run: |
          rm CHANGELOG.md

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          output: results1.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will hand over control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647
          project-token: "${{ secrets.CODACY_PROJECT_TOKEN }}"
          upload: false

      - name: Clean duplicate categories
        # https://github.com/codacy/codacy-analysis-cli-action/issues/142#issuecomment-4223520345
        shell: bash
        run: |
          jq '.runs |= (
            # Group runs by tool name to create unique categories (Post-March 27, 2026 GitHub requirement)
            group_by(.tool.driver.name) |
            map(
              # Store the group and the first element (as template)
              . as $group |
              .[0] as $first |
              # Rebuild the run object by collecting data in a single pass
              $first + {
                # Add mandatory category ID
                "automationDetails": ($first.automationDetails + { "id": ("Codacy/" + $first.tool.driver.name) }),
                # Collect all results and artifacts from the group
                "results": ([$group[].results[]] | unique),
                "artifacts": ([$group[].artifacts[]] | unique),
                # Merge all invocation fields and calculate global success
                "invocations": [
                  (
                    reduce $group[].invocations[] as $item ({}; . + $item) |
                    . + { "executionSuccessful": ([$group[].invocations[].executionSuccessful] | all) }
                  )
                ]
              }
            )
          )' -- './results1.sarif' 1> './results2.sarif'

      - run: jq '.runs |= map(select(.results | length > 0))' results2.sarif > results2b.sarif

      # codacy/codacy-analysis-cli-action/issues/95
      - name: Remove duplicate runs
        run: jq -c '.runs |= unique_by({tool, invocations, results})' < ./results2b.sarif > ./results3.sarif

      - uses: actions/upload-artifact@v6
        with:
          name: results-all
          path: results*

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results3.sarif
          category: codacy-security-scan
